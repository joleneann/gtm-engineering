<svg xmlns="http://www.w3.org/2000/svg" width="830" height="666" viewBox="0 0 830 666" role="img" aria-label="Form D outbound pipeline"><title>Form D outbound pipeline</title><desc>A top to bottom flow. SEC EDGAR filings are stored whole in Supabase, routed through three gates, scored out of ten, built into a Clay payload, enriched by Clay, deduped on return, then carried by n8n into Pipedrive. Only a test row is ever sent; a real company gets a drafted task and nothing leaves. Everything on the right leaves the run.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="12" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text x="58" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888780">Python and Supabase</text><rect x="230" y="12" width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text x="248" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888780">Clay</text><rect x="300" y="12" width="11" height="11" rx="2" fill="#FAECE7" stroke="#993C1D"/><text x="318" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888780">n8n and Pipedrive</text><rect x="474" y="12" width="11" height="11" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="492" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888780">leaves the run</text><rect x="40" y="44" width="480" height="40" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="56" y="69" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">SEC EDGAR</text><text x="240" y="69" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">filings and filing history</text><path d="M280 84 L280 104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="106" width="480" height="40" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="131" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Supabase</text><text x="240" y="131" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">every field becomes a column</text><path d="M280 146 L280 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="168" width="480" height="40" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="193" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Three route outs</text><text x="240" y="193" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">funds, location, no industry</text><rect x="540" y="168" width="270" height="40" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="556" y="193" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444441">Funds and unserviceable, out</text><path d="M520 188 L538 188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M280 208 L280 228" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="230" width="480" height="40" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Score out of 10</text><text x="240" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">four inputs from the filing</text><path d="M280 270 L280 290" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="292" width="480" height="40" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="317" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Clay payload</text><text x="240" y="317" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">13 columns per company</text><rect x="540" y="292" width="270" height="40" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="556" y="317" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444441">Mill and signer lists, out</text><path d="M520 312 L538 312" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M280 332 L280 352" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="354" width="480" height="40" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="56" y="379" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#085041">Clay enriches</text><text x="240" y="379" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F6E56">domain, work email, the copy</text><path d="M280 394 L280 414" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="416" width="480" height="40" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="56" y="441" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Dedupe on return</text><text x="240" y="441" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">against three tables</text><rect x="540" y="416" width="270" height="40" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="556" y="441" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444441">Customers and inbound, out</text><path d="M520 436 L538 436" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M280 456 L280 476" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="478" width="480" height="40" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="56" y="503" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Outbound run</text><text x="240" y="503" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">in n8n: org, person, deal</text><path d="M280 518 L280 538" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="540" width="480" height="40" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="56" y="565" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Test row</text><text x="240" y="565" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">sends, deal moves to Emailed</text><rect x="540" y="540" width="270" height="40" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="556" y="565" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444441">Real company: no email sent</text><path d="M520 560 L538 560" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M280 580 L280 600" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="602" width="480" height="40" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="56" y="627" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Reply catcher</text><text x="240" y="627" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">a reply moves it to Replied</text></svg>
