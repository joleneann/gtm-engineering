<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-label="Form D outbound pipeline"><title>Form D outbound pipeline</title><desc>SEC EDGAR filings are stored whole in Supabase, routed through three gates, scored out of ten, built into a Clay payload, enriched by Clay, deduped on return, then carried by two n8n workflows into Pipedrive. Only a test row is ever sent; a real company gets a drafted task and nothing leaves.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="32" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text x="48" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#888780">Python and Supabase</text><rect x="220" y="32" width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text x="238" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#888780">Clay</text><rect x="290" y="32" width="11" height="11" rx="2" fill="#FAECE7" stroke="#993C1D"/><text x="308" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#888780">n8n and Pipedrive</text><rect x="464" y="32" width="11" height="11" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="482" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#888780">leaves the run</text><rect x="30" y="80" width="260" height="64" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="46" y="107" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">SEC EDGAR</text><text x="46" y="127" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">filings and filing history</text><rect x="315" y="80" width="260" height="64" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="331" y="107" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Stored whole in Supabase</text><text x="331" y="127" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">filings_raw, entities_raw</text><rect x="600" y="80" width="260" height="64" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="616" y="107" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Three route outs</text><text x="616" y="127" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">funds, location, no industry</text><rect x="315" y="170" width="260" height="64" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="331" y="197" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">Routed out</text><text x="331" y="217" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">funds, unserviceable, other</text><rect x="600" y="260" width="260" height="64" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="616" y="287" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Score out of 10</text><text x="616" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">four inputs from the filing</text><rect x="315" y="260" width="260" height="64" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="331" y="287" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Clay payload built</text><text x="331" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">13 columns per company</text><rect x="30" y="260" width="260" height="64" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="46" y="287" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#085041">Clay enriches</text><text x="46" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F6E56">domain, work email, copy</text><rect x="315" y="350" width="260" height="64" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="331" y="377" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">Candidates stripped</text><text x="331" y="397" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">mill and signer lists</text><rect x="30" y="440" width="260" height="64" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="46" y="467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#3C3489">Dedupe on return</text><text x="46" y="487" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#534AB7">against three tables</text><rect x="315" y="440" width="260" height="64" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="331" y="467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Outbound run, in n8n</text><text x="331" y="487" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">org, person, deal created</text><rect x="600" y="440" width="260" height="64" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="616" y="467" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Test row</text><text x="616" y="487" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">sends, deal to Emailed</text><rect x="30" y="530" width="260" height="64" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="46" y="557" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">Removed</text><text x="46" y="577" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">customer, inbound, emailed</text><rect x="315" y="530" width="260" height="64" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="331" y="557" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#444441">Real company</text><text x="331" y="577" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F5E5A">task drafted, nothing sent</text><rect x="600" y="530" width="260" height="64" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="616" y="557" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#712B13">Reply catcher, in n8n</text><text x="616" y="577" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#993C1D">reply moves it to Replied</text><path d="M290 112 L311 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M575 112 L596 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M730 144 L730 157 L445 157 L445 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M730 144 L730 256" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M598 292 L579 292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M313 292 L294 292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M445 324 L445 346" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M160 324 L160 436" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M290 472 L311 472" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M575 472 L596 472" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M160 504 L160 526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M445 504 L445 526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M730 504 L730 526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/></svg>
