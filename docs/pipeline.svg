<svg xmlns="http://www.w3.org/2000/svg" width="580" height="688" viewBox="0 0 580 688" role="img" aria-label="Form D outbound pipeline"><title>Form D outbound pipeline</title><desc>A top to bottom flow. SEC EDGAR filings are stored whole in Supabase, routed through three gates, scored out of ten, built into a Clay payload, enriched by Clay, deduped on return, then carried by n8n into Pipedrive. Only a test row is ever sent; a real company gets a drafted task and nothing leaves. Everything on the right leaves the run.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="24" y="6" width="11" height="11" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888780">Python and Supabase</text><rect x="195" y="6" width="11" height="11" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text x="213" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888780">Clay</text><rect x="261" y="6" width="11" height="11" rx="2" fill="#FAECE7" stroke="#993C1D"/><text x="279" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888780">n8n and Pipedrive</text><rect x="418" y="6" width="11" height="11" rx="2" fill="#F1EFE8" stroke="#5F5E5A"/><text x="436" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888780">out of the run</text><rect x="24" y="44" width="250" height="48" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="38" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">SEC EDGAR</text><text x="38" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">daily index, filings, history</text><path d="M149 92 L149 106" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="108" width="250" height="48" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="38" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Stored whole in Supabase</text><text x="38" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7">filings_raw, entities_raw</text><path d="M149 156 L149 170" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="172" width="250" height="48" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="38" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Three route outs</text><text x="38" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7">funds, location, no industry</text><rect x="330" y="172" width="230" height="48" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="344" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Routed out</text><text x="344" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">funds, unserviceable, other</text><path d="M274 196 L328 196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M149 220 L149 234" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="236" width="250" height="48" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="38" y="256" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Score out of 10</text><text x="38" y="274" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7">four inputs from the filing</text><path d="M149 284 L149 298" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="300" width="250" height="48" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="38" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Clay payload built</text><text x="38" y="338" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7">13 columns per company</text><rect x="330" y="300" width="230" height="48" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="344" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Candidates stripped</text><text x="344" y="338" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">mill and signer lists</text><path d="M274 324 L328 324" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M149 348 L149 362" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="364" width="250" height="48" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="38" y="384" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Clay enriches</text><text x="38" y="402" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56">domain, work email, the copy</text><path d="M149 412 L149 426" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="428" width="250" height="48" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="38" y="448" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Dedupe on return</text><text x="38" y="466" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7">against three tables</text><rect x="330" y="428" width="230" height="48" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="344" y="448" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Removed</text><text x="344" y="466" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">customer, inbound, emailed</text><path d="M274 452 L328 452" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M149 476 L149 490" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="492" width="250" height="48" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="38" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Outbound run, in n8n</text><text x="38" y="530" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#993C1D">org, person, deal at Enriched</text><path d="M149 540 L149 554" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="556" width="250" height="48" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="38" y="576" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Test row</text><text x="38" y="594" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#993C1D">sends, deal moves to Emailed</text><rect x="330" y="556" width="230" height="48" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="344" y="576" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Real company</text><text x="344" y="594" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">task drafted, nothing sends</text><path d="M149 604 L149 618" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="620" width="250" height="48" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="38" y="640" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Reply catcher, in n8n</text><text x="38" y="658" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#993C1D">a reply moves it to Replied</text><path d="M149 540 L149 548 L445 548 L445 554" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/></svg>
